<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Revisualizer</title>
<meta name="description" content="Open-source reality re-render for driving logs: 3D Gaussian splats from surround cameras, shown in a game-style car UI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/",
  "@sparkjsdev/spark": "./vendor/spark.module.js"
} }
</script>
</head>
<body>
<div id="screen" class="screen">
  <div id="view" class="view"></div>
  <div id="genview" class="genview hidden"><img id="genimg" alt=""><div class="genlabel">AI re-render · live mode</div></div>
  <div id="splitbar" class="splitbar hidden"><span>SPLAT</span><i></i><span>AI</span></div>
  <div id="camview" class="camview hidden"></div>

  <!-- top-left driving cluster -->
  <div class="hud tl">
    <div class="row gear-row">
      <div class="prnd"><span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span></div>
      <div class="batt"><i><b style="width:78%"></b></i><span>78 %</span></div>
    </div>
    <div class="speed-block">
      <div class="speed" id="speed">0</div>
      <div class="unit">MPH</div>
    </div>
    <div class="nav">
      <svg id="turnicon" viewBox="0 0 40 40" class="turnicon"><path d="M26 33V20a6 6 0 0 0-6-6H11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M15 8l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><div class="navdist" id="navdist">0.2 mi</div><div class="navstreet" id="navstreet">Next turn</div></div>
    </div>
    <div class="sd">
      <div class="sd-title">Self-Driving</div>
      <div class="sd-mode">Standard <svg viewBox="0 0 10 6" width="8"><path d="M1 1l4 4 4-4" stroke="currentColor" fill="none" stroke-width="1.4"/></svg></div>
      <div class="sd-sub">Street</div>
    </div>
    <div class="streak"><div id="streak">0.0 mi</div><span>Streak</span></div>
    <div class="limit"><small>SPEED<br>LIMIT</small><b id="limit">25</b></div>
    <svg class="lamp" viewBox="0 0 28 20"><path d="M12 3c-4 0-6 3-6 7s2 7 6 7h2V3z" fill="none" stroke="#3ddc84" stroke-width="2"/><path d="M17 5h8M17 10h8M17 15h8" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/></svg>
  </div>

  <!-- top centre / right -->
  <div class="hud tc"><svg viewBox="0 0 16 20" width="14"><rect x="2" y="9" width="12" height="10" rx="2" fill="#fff"/><path d="M4.5 9V6a3.5 3.5 0 0 1 7 0v3" stroke="#fff" stroke-width="2" fill="none"/></svg></div>
  <div class="hud tr">
    <span id="clock">10:03 pm</span>
    <span class="wx"><svg viewBox="0 0 24 16" width="20"><path d="M7 14h11a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 14z" fill="#fff"/></svg> 58°F</span>
    <span class="dot"></span>
    <span class="airbag"><svg viewBox="0 0 20 20" width="18"><circle cx="10" cy="10" r="8" stroke="#fff" fill="none" stroke-width="1.5"/><circle cx="10" cy="7" r="2" fill="#fff"/><path d="M6 15c1-3 7-3 8 0" stroke="#fff" fill="none" stroke-width="1.5"/></svg><small>PASSENGER<br><em>AIRBAG ON</em></small></span>
  </div>

  <!-- tap-to-go toast -->
  <div id="toast" class="toast hidden"><span class="pin"></span><span id="toasttext">Going to pin</span><button id="resume">Resume route</button></div>

  <!-- camera strip (dashcam style) -->
  <div id="strip" class="strip hidden"></div>

  <!-- scrubber -->
  <div class="scrub" id="scrub">
    <button id="play" class="icon-btn" title="Play / pause (space)">
      <svg viewBox="0 0 20 20" class="i-pause"><rect x="4" y="3" width="4" height="14" rx="1"/><rect x="12" y="3" width="4" height="14" rx="1"/></svg>
      <svg viewBox="0 0 20 20" class="i-play"><path d="M5 3l12 7-12 7z"/></svg>
    </button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="tlabel">0.0 s</span>
  </div>

  <!-- bottom bar -->
  <div class="hud bl">
    <button class="pill" id="mapbtn"><svg viewBox="0 0 20 20" width="18"><path d="M10 2a5 5 0 0 0-5 5c0 4 5 9 5 9s5-5 5-9a5 5 0 0 0-5-5z" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="10" cy="7" r="1.8" fill="#fff"/></svg>Map</button>
    <button class="pill sq" id="nightbtn" title="Night mode"><svg viewBox="0 0 20 20" width="18"><path d="M14 13.5A6.5 6.5 0 0 1 7 3a7 7 0 1 0 9.8 9.6 6.6 6.6 0 0 1-2.8.9z" fill="#fff"/></svg></button>
    <button class="pill sq" id="cambtn" title="Cameras (C)"><svg viewBox="0 0 22 16" width="20"><rect x="1" y="2" width="14" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M15 6l6-3v10l-6-3z" fill="#fff"/></svg></button>
    <div class="seg hidden" id="modeseg"><button data-m="splat" class="on">Splat</button><button data-m="gen">AI</button><button data-m="split">Split</button></div>
    <button class="pill sq" id="viewbtn" title="Camera view (V)"><svg viewBox="0 0 20 20" width="18"><path d="M3 15l7-11 7 11z" fill="none" stroke="#fff" stroke-width="1.6"/></svg></button>
  </div>
  <div class="hud bc media">
    <div class="art"></div>
    <div class="meta"><div class="song">Night Drive</div><div class="artist"><i></i>OPEN REVISUALIZER</div></div>
    <div class="mctl top"><svg viewBox="0 0 20 20"><path d="M3 6h3l8 8h3M3 14h3l2-2M12 8l2-2h3M15 4l2 2-2 2M15 12l2 2-2 2" fill="none" stroke="#fff" stroke-width="1.5"/></svg><svg viewBox="0 0 20 20"><path d="M4 9V7a2 2 0 0 1 2-2h10l-2-2M16 11v2a2 2 0 0 1-2 2H4l2 2" fill="none" stroke="#fff" stroke-width="1.5"/></svg></div>
    <div class="progress"><b id="mprog"></b></div>
    <div class="mctl bottom">
      <svg viewBox="0 0 20 20"><path d="M5 4v12M16 4L8 10l8 6z" fill="#fff" stroke="#fff" stroke-width="1.5"/></svg>
      <svg viewBox="0 0 20 20"><rect x="5" y="4" width="3" height="12" fill="#fff"/><rect x="12" y="4" width="3" height="12" fill="#fff"/></svg>
      <svg viewBox="0 0 20 20"><path d="M15 4v12M4 4l8 6-8 6z" fill="#fff" stroke="#fff" stroke-width="1.5"/></svg>
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M10 6v8M6 10h8" stroke="#fff" stroke-width="1.5"/></svg>
      <svg viewBox="0 0 20 20"><path d="M5 3v14M10 3v14M15 3v14" stroke="#fff" stroke-width="1.5"/><rect x="3.5" y="6" width="3" height="2" fill="#fff"/><rect x="8.5" y="11" width="3" height="2" fill="#fff"/><rect x="13.5" y="8" width="3" height="2" fill="#fff"/></svg>
      <svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M12.5 12.5l4 4" stroke="#fff" stroke-width="1.5"/></svg>
    </div>
  </div>
  <div class="hud br trip">
    <div class="trow"><b id="eta">10:06 pm</b><span><span id="remtime">3 min</span>&nbsp;&nbsp;<span id="remdist">0.2 mi</span></span></div>
    <div class="trow sub"><span id="dest">Route end</span><span><svg viewBox="0 0 22 12" width="18"><rect x="1" y="1" width="18" height="10" rx="2" fill="none" stroke="#fff" stroke-width="1.4"/><rect x="3" y="3" width="11" height="6" fill="#fff"/><rect x="19.5" y="4" width="2" height="4" fill="#fff"/></svg> 77%</span></div>
    <div class="trow actions"><svg viewBox="0 0 20 20" width="18"><path d="M8 2a5 5 0 0 0-5 5c0 4 5 9 5 9s5-5 5-9a5 5 0 0 0-5-5z" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M15 3v6M12 6h6" stroke="#fff" stroke-width="1.6"/></svg><button id="endtrip">End Trip</button><span class="more">···</span></div>
  </div>

  <div id="loader" class="loader"><div class="spin"></div><div id="loadtext">Re-rendering reality…</div></div>
  <div class="credit" id="credit"></div>
</div>

<script type="module">
  import { createRevisualizer } from "./revisualizer.js";
  import { bindHud } from "./hud.js";
  const q = new URLSearchParams(location.search);
  const rv = await createRevisualizer({
    container: document.getElementById("view"),
    scene: q.get("scene") || null,
    autoplay: q.get("autoplay") !== "0",
    speed: parseFloat(q.get("speed") || "1"),
    view: q.get("view") || "reality",
    night: q.get("night") === "1",
    onProgress: (p) => { document.getElementById("loadtext").textContent = `Re-rendering reality… ${Math.round(p * 100)}%`; },
  });
  bindHud(rv, document.getElementById("screen"), { hud: q.get("hud") !== "0", t: parseFloat(q.get("t") || "0") });
  window.revis = rv;
</script>
</body>
</html>
